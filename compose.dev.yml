services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev

    working_dir: /app

    ports:
      - "5173:5173"

    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - firebase_emulators:/root/.cache/firebase/emulators

volumes:
  node_modules:
  firebase_emulators: